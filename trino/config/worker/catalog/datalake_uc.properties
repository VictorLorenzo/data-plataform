connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://unity-catalog-server:8080/api/2.1/unity-catalog/iceberg
iceberg.rest-catalog.warehouse=datalake_uc
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=not_used
fs.native-s3.enabled=true
s3.endpoint=https://${ENV:R2_ACCOUNT_ID}.r2.cloudflarestorage.com
s3.path-style-access=true
s3.aws-access-key=${ENV:R2_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:R2_SECRET_ACCESS_KEY}
s3.region=auto
